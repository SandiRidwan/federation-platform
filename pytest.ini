[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
addopts = -q --strict-markers --no-header -ra
# `data` holds the Trino/Druid runtime directories, which contain Docker-created junctions that
# Windows refuses to stat. Without this, collection dies before a single test runs.
norecursedirs = data docs azure_layer/powerbi/out .git .venv __pycache__
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
