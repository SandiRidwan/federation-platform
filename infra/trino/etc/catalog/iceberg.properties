connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=federation
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg
iceberg.jdbc-catalog.connection-user=federation
iceberg.jdbc-catalog.connection-password=federation
iceberg.jdbc-catalog.default-warehouse-dir=s3://federation/iceberg
fs.native-s3.enabled=true
s3.endpoint=http://s3:9090
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=federation
s3.aws-secret-key=federation123
